<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SVG GENERATOR</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#1a1a1a;
    color:white;
    font-family:Arial, sans-serif;
    padding:50px;
}

.container{
    max-width:1000px;
    margin:auto;
}

h1{
    font-size:64px;
    text-align:center;
    margin-bottom:30px;
}

h2{
    margin-bottom:15px;
}

.card{
    background:#252525;
    border-radius:18px;
    padding:30px;
    margin-bottom:30px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.35);
}

.team{
    font-size:22px;
    line-height:1.8;
}

.svg-container{
    display:flex;
    justify-content:center;
    align-items:center;
}

.image-container{
    text-align:center;
}

.image-container img{
    max-width:100%;
    border-radius:12px;
}

.video-container{
    position:relative;
    overflow:hidden;
    border-radius:12px;
}

.video-container iframe{
    width:100%;
    height:500px;
    border:none;
}

</style>
</head>

<body>

<div class="container">

    <!-- TITLE -->

    <h1>SVG GENERATOR</h1>

    <!-- TEAM -->

    <div class="card">

        <h2>Team Members</h2>
        
<div class="center team-logo">

<svg
xmlns="http://www.w3.org/2000/svg"
width="600"
height="400"
viewBox="0 0 600 400"
>

<rect width="600" height="400" fill="#0B3D91"/>

<path
d="M300 80
L420 160
L420 280
L300 360
L180 280
L180 160
Z"

fill="white"
stroke="#08306B"
stroke-width="5"
/>

<text
x="300"
y="180"
font-family="Arial Black, Arial, sans-serif"
font-size="72"
fill="#0B3D91"
font-weight="bold"
text-anchor="middle"
dominant-baseline="middle">

SVG

</text>

<text
x="300"
y="260"
font-family="Arial Black, Arial, sans-serif"
font-size="36"
fill="#0B3D91"
letter-spacing="6"
font-weight="bold"
text-anchor="middle"
dominant-baseline="middle">

HEROES

</text>

<polygon
points="300,50 312,85 350,85 318,110 330,145 300,125 270,145 282,110 250,85 288,85"
fill="#FFD700"
/>

<polygon
points="200,200 210,215 230,215 215,225 220,245 200,235 180,245 185,225 170,215 190,215"
fill="#FFD700"
/>

<polygon
points="400,200 410,215 430,215 415,225 420,245 400,235 380,245 385,225 370,215 390,215"
fill="#FFD700"
/>

</svg>

</div>

        <div class="team">
            Lupita Vásquez Fabela<br>
            Sri Dasari
        </div>

    </div>

    <!-- SVG -->

    <div class="card">

        <h2>Animated SVG</h2>

        <div class="svg-container">

            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="600"
                height="400"
                viewBox="0 0 600 400"
            >

                <text
                    x="150"
                    y="200"
                    font-family="Arial"
                    font-size="120"
                    fill="blue"
                >
                    S

                    <animate
                        attributeName="y"
                        values="200;160;200"
                        dur="0.5s"
                        repeatCount="indefinite"
                    />

                </text>


                <text
                    x="350"
                    y="200"
                    font-family="Arial"
                    font-size="120"
                    fill="green"
                >
                    L

                    <animate
                        attributeName="y"
                        values="200;160;200"
                        dur="0.3s"
                        repeatCount="indefinite"
                    />

                </text>

            </svg>

        </div>

    </div>

    <!-- IMAGE -->

    <div class="card">

        <h2>Image</h2>

        <div class="image-container">

            <img
                src="datadog.png"
                alt="Datadog"
            >

        </div>

    </div>

    <!-- VIDEO -->

    <div class="card">

        <h2>Project Video</h2>

        <div class="video-container">

            <!-- Replace VIDEO_ID -->

            <iframe
                src="https://www.youtube.com/embed/cCcEM16hXSM" 
                allowfullscreen>
            </iframe>

        </div>

    </div>

</div>

</body>
</html>
